<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Files to PDF Tool</title>

  <!-- 📦 Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
      background: #f0f2f5;
      color: #333;
    }
    h2 {
      margin-bottom: 1rem;
    }
    input, select, button {
      margin: 0.5rem 0;
      padding: 0.6rem;
      font-size: 1rem;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background: #0056b3;
    }

    #preview {
      margin-top: 1rem;
    }
    .block {
      background: white;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      transition: transform 0.2s ease;
    }
    .block:hover {
      transform: scale(1.01);
    }
    .block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .block small {
      color: #666;
      font-style: italic;
      display: block;
      margin-bottom: 0.5rem;
    }
    .delete-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .options {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    label {
      font-weight: 500;
    }
    .sortable-ghost {
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <h2>🧠 Smart File to PDF Converter</h2>

  <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.docx,.txt" multiple>

  <div class="options">
    <label for="pageSize">📄 Page Size:</label>
    <select id="pageSize">
      <option value="a4">A4</option>
      <option value="letter">Letter</option>
    </select>

    <label for="exportMode">📤 Export Mode:</label>
    <select id="exportMode">
      <option value="merged">Single Merged PDF</option>
      <option value="separate">Separate PDFs</option>
    </select>

    <button onclick="generatePDFs()">Export PDF(s)</button>
  </div>

  <div id="preview"></div>

  <script>
    const preview = document.getElementById('preview');

    new Sortable(preview, {
      animation: 150,
      ghostClass: 'sortable-ghost'
    });

    document.getElementById('fileInput').addEventListener('change', function () {
      preview.innerHTML = '';
      const files = Array.from(this.files);
      files.forEach(processFile);
    });

    function processFile(file) {
      const wrapper = document.createElement('div');
      wrapper.className = 'block';

      const header = document.createElement('div');
      header.className = 'block-header';

      const title = document.createElement('strong');
      title.textContent = file.name;

      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.textContent = '🗑️ Delete';
      del.onclick = () => wrapper.remove();

      header.appendChild(title);
      header.appendChild(del);
      wrapper.appendChild(header);

      const info = document.createElement('small');

      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = document.createElement('img');
          img.src = e.target.result;
          img.style.maxWidth = '100%';
          info.textContent = '📷 Image = ~1 page';
          wrapper.appendChild(info);
          wrapper.appendChild(img);
        };
        reader.readAsDataURL(file);
      } else if (file.name.endsWith('.docx')) {
        const reader = new FileReader();
        reader.onload = (e) => {
          mammoth.convertToHtml({ arrayBuffer: e.target.result }).then(result => {
            const div = document.createElement('div');
            div.innerHTML = result.value;
            const text = div.innerText || '';
            const words = text.split(/\s+/).length;
            info.textContent = `📄 ${words} words (~${Math.ceil(words/300)} pages)`;
            wrapper.appendChild(info);
            wrapper.appendChild(div);
          });
        };
        reader.readAsArrayBuffer(file);
      } else if (file.type === 'text/plain') {
        const reader = new FileReader();
        reader.onload = (e) => {
          const div = document.createElement('div');
          div.textContent = e.target.result;
          const words = div.textContent.split(/\s+/).length;
          info.textContent = `📄 ${words} words (~${Math.ceil(words/300)} pages)`;
          wrapper.appendChild(info);
          wrapper.appendChild(div);
        };
        reader.readAsText(file);
      } else {
        const msg = document.createElement('div');
        msg.textContent = "⚠️ Unsupported file type";
        wrapper.appendChild(msg);
      }

      preview.appendChild(wrapper);
    }

    function generatePDFs() {
      const pageSize = document.getElementById('pageSize').value;
      const mode = document.getElementById('exportMode').value;
      const blocks = Array.from(preview.children);

      if (blocks.length === 0) {
        alert("Please upload some files.");
        return;
      }

      if (mode === 'merged') {
        const merged = document.createElement('div');
        blocks.forEach(block => {
          merged.appendChild(block.cloneNode(true));
        });

        html2pdf().from(merged).set({
          margin: 10,
          filename: 'merged.pdf',
          html2canvas: { scale: 2 },
          jsPDF: { format: pageSize }
        }).save();

      } else {
        blocks.forEach((block, index) => {
          const clone = block.cloneNode(true);
          html2pdf().from(clone).set({
            margin: 10,
            filename: `file-${index + 1}.pdf`,
            html2canvas: { scale: 2 },
            jsPDF: { format: pageSize }
          }).save();
        });
      }
    }
  </script>

</body>
</html>
